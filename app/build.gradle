plugins {
    id 'com.android.application'
    id 'jacoco'
}

// 签名配置从 keystore.properties 读（该文件在 .gitignore 里，不入仓库）。
// release 必须使用正式签名：缺失或 storeFile 未配置时在执行前硬失败，
// 禁止回退 debug 签名、禁止产出未签名包。debug 不受影响。
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasKeystore = keystorePropsFile.exists() && keystoreProps.getProperty("storeFile")

android {
    namespace 'com.quietbox.app'
    // The installed package is "platforms;android-37.2" (dir android-37.2), which AGP
    // cannot resolve from the bare compileSdk 37 name. Renaming the install dir to
    // android-37 is what satisfies AGP; documented in README.
    compileSdk 37

    defaultConfig {
        // 仓库新规：新模块包名必须是自有域名或 io.github.[用户名].[模块名]。
        // 这里用后者（自动审批）。Java 包名保持 com.quietbox.app 不变。
        applicationId "io.github.yigenhuobah.quietbox"
        minSdk 29
        targetSdk 36
        versionCode 11
        versionName "0.7.0"
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // hook 集已稳定，开启 R8 收缩（Material 依赖会让 APK 涨到 10MB 级）。
            // 入口类与回调的 keep 规则见 proguard-rules.pro。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                output.outputFileName = "quietbox-${variant.versionName}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
    // Provided by the framework inside the hooked process; must never be packaged.
    compileOnly 'io.github.libxposed:api:102.0.0'
    compileOnly 'io.github.libxposed:annotation:1.0.0'

    // compileOnly 不拉传递依赖；@NonNull 来自下面的 appcompat/material 传递依赖，
    // 不再单独声明 androidx.annotation，避免与它们的版本约束冲突。

    // service must be PACKAGED, not compileOnly: the manifest declares
    // io.github.libxposed.service.XposedProvider, and it is instantiated inside the
    // module app's own process (compileOnly classes are absent at runtime).
    // XposedProvider only forwards a binder and touches no hooked-process API.
    implementation 'io.github.libxposed:service:102.0.0'

    // UI 只在模块 App 进程用；hook 代码绝不引用这些类，所以不会影响宿主进程。
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    // Config 的公开方法签名引用 XposedModule；主源码 compileOnly 在单测运行期不可见，
    // 这里补同一坐标（不新增新库）。
    testImplementation 'io.github.libxposed:api:102.0.0'
}

// ---------------------------------------------------------------- JaCoCo
// 只生成覆盖率报告，不设阈值、不阻断构建；数据源固定为 testDebugUnitTest。
// 输出：app/build/reports/jacoco/jacocoTestReport/{html,jacocoTestReport.xml}
tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    group = 'verification'
    description = 'Generates HTML/XML JaCoCo reports from debug unit tests.'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
        xml.outputLocation = layout.buildDirectory.file(
                'reports/jacoco/jacocoTestReport/jacocoTestReport.xml')
        html.outputLocation = layout.buildDirectory.dir(
                'reports/jacoco/jacocoTestReport/html')
    }

    def debugClassesDir = layout.buildDirectory.dir('intermediates/javac/debug').get().asFile
    def jacocoDir = layout.buildDirectory.dir('jacoco').get().asFile
    def coverageDir = layout.buildDirectory.dir(
            'outputs/unit_test_code_coverage/debugUnitTest').get().asFile

    classDirectories.setFrom(files(fileTree(
            dir: debugClassesDir,
            includes: ['**/*.class'],
            excludes: [
                    '**/R.class',
                    '**/R$*.class',
                    '**/BuildConfig.class',
            ])))
    sourceDirectories.setFrom(files('src/main/java'))
    // AGP + jacoco 插件默认把 testDebugUnitTest 数据写到 build/jacoco/；
    // 开启 enableUnitTestCoverage 的工程则落在 outputs/unit_test_code_coverage/。两处都收。
    executionData.setFrom(files(
            fileTree(dir: jacocoDir, includes: ['testDebugUnitTest.exec']),
            fileTree(dir: coverageDir, includes: ['*.exec'])))
}

// release 必须使用正式签名：keystore.properties 缺失 / storeFile 未配置时，
// 只要本次任务图里出现 release 变体任务就在执行前失败，避免静默产出 debug 签名版本。
// 用 taskGraph.whenReady 覆盖 assemble/package/install/bundle 全部入口；debug 不受影响。
def releaseTaskNames = ["assembleRelease", "packageRelease", "installRelease", "bundleRelease"]
gradle.taskGraph.whenReady { graph ->
    if (!hasKeystore && graph.allTasks.any { it.project == project && releaseTaskNames.contains(it.name) }) {
        throw new GradleException("缺少有效 keystore.properties（storeFile 未配置）：release 构建必须使用正式签名")
    }
}
